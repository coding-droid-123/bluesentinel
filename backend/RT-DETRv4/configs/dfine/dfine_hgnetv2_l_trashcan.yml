__include__: [
  '../dataset/trashcan_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]
 
output_dir: /kaggle/working/outputs/dfine_trashcan_58ep
 
HGNetv2:
  name: 'B4'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True
 
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000125
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
 
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125
 
epoches: 58
 
train_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      policy:
        epoch: [5, 29, 48]
 
  collate_fn:
    mixup_epochs: [5, 29]
    stop_epoch: 48
 
val_dataloader:
  total_batch_size: 16
